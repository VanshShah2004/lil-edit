    <!-- viewport-fit=cover extends the layout viewport into the device safe areas
         (notch, home indicator, Android gesture inset). Without it the layout
         viewport stops short of the glass, so a `fixed bottom-0` sheet cannot reach
         the screen edge and the exposed strip paints html's background instead.
         It also activates every env(safe-area-inset-*) in the codebase, which all
         computed to 0px before this. Surfaces pinned to a screen edge therefore pad
         themselves with env() — see Navbar/UserNavbar (top), QuickViewDrawer,
         ShareSheet and SearchPanel (bottom). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
