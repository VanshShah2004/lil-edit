# Split hosting: backend runs separately on EC2. Render hosts only the static
# frontend build — no backend runtime/secrets belong here. See lil-edit/.env.example
# for why VITE_API_URL / VITE_BACKEND_URL must point at the EC2 backend's public URL.
services:
  - type: web
    name: lil-edit-portal
    runtime: static
    branch: main
    rootDir: lil-edit
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      # Product pages are proxied to the EC2 backend, which returns this same SPA
      # shell with per-product Open Graph tags injected — so a shared PDP link
      # unfurls into a product card in WhatsApp/iMessage/Telegram/Facebook instead
      # of showing nothing. A static host cannot do this: it serves one generic
      # index.html for every route, and crawlers don't run JS.
      #
      # A rewrite (proxy, not redirect) is what keeps the URL on this domain and
      # avoids a loop — the backend returns the page rather than redirecting back
      # here. Assets, and every other route, still come straight off this CDN.
      # MUST stay above the SPA catch-all: routes match in order.
      #
      # NOTE: the API host is hardcoded because Render does not interpolate env
      # vars into routes. Update it if the backend moves.
      - type: rewrite
        source: /collections/:category/product/:productPath
        destination: https://api.theliledit.com/pdp/:category/:productPath
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: VITE_IMAGE_CDN_BASE
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_BACKEND_URL
        sync: false
